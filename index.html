<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Jobxplo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0f19;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      overflow: hidden;
    }
    #globeViz { width: 100vw; height: 100vh; }

    #header {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
    }
    #header h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
    }
    #header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: #9aa4b2;
    }

    #legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      font-size: 0.8rem;
      color: #cbd5e1;
      background: rgba(15, 20, 32, 0.7);
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.6;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }

    #status {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      font-size: 0.8rem;
      color: #9aa4b2;
      background: rgba(15, 20, 32, 0.7);
      padding: 8px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>Jobxplo</h1>
    <p>Jobs posted today, yesterday, or 2 days ago — click a dot to open the listing</p>
  </div>

  <div id="legend">
    <div><span class="dot" style="background:#22c55e"></span>Today</div>
    <div><span class="dot" style="background:#eab308"></span>Yesterday</div>
    <div><span class="dot" style="background:#f97316"></span>2 days ago</div>
  </div>

  <div id="status">Loading jobs…</div>

  <div id="globeViz"></div>

  <script src="https://unpkg.com/globe.gl"></script>
  <script>
    const FRESHNESS_COLOR = {
      "today": "#22c55e",
      "yesterday": "#eab308",
      "2 days ago": "#f97316"
    };

    const statusEl = document.getElementById("status");

    const world = Globe()
      (document.getElementById("globeViz"))
      .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-night.jpg")
      .backgroundColor("#0b0f19")
      .pointOfView({ lat: 20, lng: 0, altitude: 2.2 }, 0)
      .pointAltitude(0.01)
      .pointRadius(0.35)
      .pointColor(d => FRESHNESS_COLOR[d.freshness] || "#888888")
      .pointLabel(d => `
        <div style="font-family: system-ui, sans-serif; background: rgba(15,20,32,0.95);
                    color: #f5f5f5; padding: 8px 10px; border-radius: 6px; max-width: 240px;">
          <strong>${d.company}</strong><br/>
          ${d.raw_title}<br/>
          <span style="color:#9aa4b2">${d.location_text} · ${d.work_mode}</span>
        </div>
      `)
      .onPointClick(d => {
        if (d.job_url) window.open(d.job_url, "_blank");
      });

    // Make rotation unmistakable: gentle auto-spin by default, and dragging
    // with the mouse/trackpad temporarily takes over, then auto-spin resumes.
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.6;
    world.controls().enableRotate = true;
    world.controls().enableZoom = true;

    // Fetch the live dataset produced by Stage 6/7. Path is relative to this
    // file, so it works the same on Vercel/Cloudflare Pages/Netlify without
    // any config change.
    fetch("./data/jobs.json")
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(data => {
        const jobs = (data.jobs || []);

        // Only jobs with a resolved coordinate can be plotted as a dot.
        // Jobs with lat/long = null (see Stage 6 notes on non-place
        // locations like "Hybrid" or "N/A") are intentionally skipped here
        // rather than plotted at a wrong or default location.
        const plottable = jobs.filter(j => j.lat != null && j.long != null);

        world.pointsData(
          plottable.map(j => ({ ...j, lat: j.lat, lng: j.long }))
        );

        const skipped = jobs.length - plottable.length;
        statusEl.textContent =
          `${plottable.length} jobs on the globe` +
          (skipped ? ` (${skipped} without a mappable location)` : "");
      })
      .catch(err => {
        statusEl.textContent = "Couldn't load job data — " + err.message;
        console.error("Failed to load data/jobs.json:", err);
      });

    // Keep the globe sized correctly if the window/orientation changes
    // (important for the mobile case).
    window.addEventListener("resize", () => {
      world.width(window.innerWidth).height(window.innerHeight);
    });
  </script>

</body>
</html>
