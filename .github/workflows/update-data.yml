name: Update job data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Update timestamp (placeholder for real fetcher)
        run: |
          python3 -c "
          import json, datetime
          with open('data/jobs.json') as f:
              data = json.load(f)
          data['generated_at'] = datetime.datetime.utcnow().isoformat() + 'Z'
          with open('data/jobs.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit updated data
        run: |
          git config user.name "jobxplo-bot"
          git config user.email "actions@github.com"
          git add data/jobs.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update job data"
          git push
