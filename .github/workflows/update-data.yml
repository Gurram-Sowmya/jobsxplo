name: Update job data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch raw job data (Stage 4)
        run: python3 scripts/fetch_jobs.py

      - name: Map job titles to role categories (Stage 5)
        run: python3 scripts/map_roles.py

      - name: Process, geocode, and tag freshness (Stage 6)
        run: python3 scripts/process_jobs.py

      - name: Commit updated data
        run: |
          git config user.name "jobxplo-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update job data"
          git push
